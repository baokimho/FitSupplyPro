      DATABASE_URL: postgresql://fitsupply_test:fitsupply_test@postgres-test:5432/catalog_test_db
      GATEWAY_SECRET: fitsupply_test_internal_secret
    command: sh -c "npm --prefix packages/shared run build && npx prisma migrate deploy --config apps/catalog-service/prisma.config.ts --schema apps/catalog-service/prisma/schema.prisma && npm --prefix apps/catalog-service run dev"
    healthcheck:
