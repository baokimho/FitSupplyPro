services:
  postgres-test:
    image: postgres:16-alpine
    container_name: fitsupply-stack-postgres-test
    environment:
      POSTGRES_DB: fitsupply_test
      POSTGRES_USER: fitsupply_test
      POSTGRES_PASSWORD: fitsupply_test
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "for db in auth_test_db catalog_test_db inventory_test_db order_test_db cart_test_db payment_test_db shipping_test_db notification_test_db; do psql -U fitsupply_test -d \"$$db\" -tAc 'SELECT 1' >/dev/null || exit 1; done",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_stack_test_data:/var/lib/postgresql/data
      - ./docker/postgres-test/init-test-dbs.sql:/docker-entrypoint-initdb.d/init-test-dbs.sql:ro

  api-gateway:
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
    container_name: fitsupply-stack-api-gateway-test
    environment:
      NODE_ENV: test
      PORT: 3000
      GATEWAY_SECRET: fitsupply_test_internal_secret
      AUTH_SERVICE_URL: http://auth-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3004
      ORDER_SERVICE_URL: http://order-service:3003
      CART_SERVICE_URL: http://cart-service:3005
      PAYMENT_SERVICE_URL: http://payment-service:3006
      SHIPPING_SERVICE_URL: http://shipping-service:3007
      NOTIFICATION_SERVICE_URL: http://notification-service:3008
    ports:
      - "3500:3000"
    command: sh -c "npm --prefix packages/shared run build && npm --prefix apps/api-gateway run dev"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      shipping-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: ./apps/auth-service/Dockerfile
    container_name: fitsupply-stack-auth-service-test
    environment:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://fitsupply_test:fitsupply_test@postgres-test:5432/auth_test_db
      GATEWAY_SECRET: fitsupply_test_internal_secret
    command: sh -c "npm --prefix packages/shared run build && npx prisma migrate deploy --config apps/auth-service/prisma.config.ts --schema apps/auth-service/prisma/schema.prisma && npm --prefix apps/auth-service run dev"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health',{headers:{'x-internal-secret':'fitsupply_test_internal_secret'}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      postgres-test:
        condition: service_healthy

  catalog-service:
    build:
      context: .
      dockerfile: ./apps/catalog-service/Dockerfile
    container_name: fitsupply-stack-catalog-service-test
    environment:
