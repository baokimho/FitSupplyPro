services:
  shared-watcher:
      image: node:20-alpine
      container_name: shared-watcher
      working_dir: /app/packages/shared
      volumes:
        - ./:/app
      command: npm run watch
      stdin_open: true
      tty: true

  api-gateway:
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
    container_name: api-gateway
    env_file:
      - ./apps/api-gateway/.env
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api-gateway/src:/app/apps/api-gateway/src
      - ./packages/shared:/app/packages/shared
    command: npm --prefix apps/api-gateway run dev
    stdin_open: true
    tty: true
    depends_on:
      - auth-service
      - catalog-service
      - inventory-service
      - order-service
      - cart-service
      - payment-service
      - shipping-service
      - notification-service
      - shared-watcher

  auth-service:
    build:
      context: .
      dockerfile: ./apps/auth-service/Dockerfile
    container_name: auth-service
    env_file:
      - ./apps/auth-service/.env
    expose:
      - "3001"
    volumes:
      - ./apps/auth-service/src:/app/apps/auth-service/src
      - ./apps/auth-service/prisma:/app/apps/auth-service/prisma
      - ./packages/shared:/app/packages/shared
    command: sh -c "npx prisma migrate deploy --config apps/auth-service/prisma.config.ts --schema apps/auth-service/prisma/schema.prisma && npm --prefix apps/auth-service run dev"
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
      shared-watcher:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    env_file:
      - ./docker/postgres/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitsupply -d fitsupply"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sql:/docker-entrypoint-initdb.d/init-multiple-dbs.sql
    ports:
      - "5433:5432"

  catalog-service:
    build:
      context: .
      dockerfile: ./apps/catalog-service/Dockerfile
    container_name: catalog-service
    env_file:
      - ./apps/catalog-service/.env
    expose:
      - "3002"
    volumes:
      - ./apps/catalog-service/src:/app/apps/catalog-service/src
      - ./apps/catalog-service/prisma:/app/apps/catalog-service/prisma
      - ./packages/shared:/app/packages/shared
    command: sh -c "npx prisma migrate deploy --config apps/catalog-service/prisma.config.ts --schema apps/catalog-service/prisma/schema.prisma && npm --prefix apps/catalog-service run seed && npm --prefix apps/catalog-service run dev"
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
      shared-watcher:
        condition: service_started

  order-service:
    build:
      context: .
      dockerfile: ./apps/order-service/Dockerfile
    container_name: order-service
    env_file:
      - ./apps/order-service/.env
    expose:
      - "3003"
    volumes:
      - ./apps/order-service/src:/app/apps/order-service/src
      - ./apps/order-service/prisma:/app/apps/order-service/prisma
      - ./packages/shared:/app/packages/shared
    command: sh -c "npx prisma migrate deploy --config apps/order-service/prisma.config.ts --schema apps/order-service/prisma/schema.prisma && npm --prefix apps/order-service run dev"
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
      shared-watcher:
        condition: service_started

  inventory-service:
    build:
      context: .
      dockerfile: ./apps/inventory-service/Dockerfile
    container_name: inventory-service
    env_file:
      - ./apps/inventory-service/.env
    expose:
      - "3004"
    volumes:
      - ./apps/inventory-service/src:/app/apps/inventory-service/src
      - ./apps/inventory-service/prisma:/app/apps/inventory-service/prisma
      - ./packages/shared:/app/packages/shared
    command: sh -c "npx prisma migrate deploy --config apps/inventory-service/prisma.config.ts --schema apps/inventory-service/prisma/schema.prisma && npm --prefix apps/inventory-service run seed && npm --prefix apps/inventory-service run dev"
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
      shared-watcher:
        condition: service_started

  cart-service:
    build:
      context: .
      dockerfile: ./apps/cart-service/Dockerfile
    container_name: cart-service
    env_file:
      - ./apps/cart-service/.env
    expose:
      - "3005"
    volumes:
      - ./apps/cart-service/src:/app/apps/cart-service/src
      - ./apps/cart-service/prisma:/app/apps/cart-service/prisma
      - ./packages/shared:/app/packages/shared
    command: sh -c "npx prisma migrate deploy --config apps/cart-service/prisma.config.ts --schema apps/cart-service/prisma/schema.prisma && npm --prefix apps/cart-service run dev"
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
      shared-watcher:
        condition: service_started

  payment-service:
    build:
      context: .
      dockerfile: ./apps/payment-service/Dockerfile
    container_name: payment-service
    env_file:
      - ./apps/payment-service/.env
    expose:
      - "3006"
    volumes:
      - ./apps/payment-service/src:/app/apps/payment-service/src
      - ./apps/payment-service/prisma:/app/apps/payment-service/prisma
      - ./packages/shared:/app/packages/shared
    command: sh -c "npx prisma migrate deploy --config apps/payment-service/prisma.config.ts --schema apps/payment-service/prisma/schema.prisma && npm --prefix apps/payment-service run dev"
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
      shared-watcher:
        condition: service_started

  shipping-service:
    build:
      context: .
      dockerfile: ./apps/shipping-service/Dockerfile
    container_name: shipping-service
    env_file:
      - ./apps/shipping-service/.env
    expose:
      - "3007"
    volumes:
      - ./apps/shipping-service/src:/app/apps/shipping-service/src
      - ./apps/shipping-service/prisma:/app/apps/shipping-service/prisma
      - ./packages/shared:/app/packages/shared
    command: sh -c "npx prisma migrate deploy --config apps/shipping-service/prisma.config.ts --schema apps/shipping-service/prisma/schema.prisma && npm --prefix apps/shipping-service run dev"
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
      shared-watcher:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: ./apps/notification-service/Dockerfile
    container_name: notification-service
    env_file:
      - ./apps/notification-service/.env
    expose:
      - "3008"
    volumes:
      - ./apps/notification-service/src:/app/apps/notification-service/src
      - ./apps/notification-service/prisma:/app/apps/notification-service/prisma
