services:
  api-gateway:
    build:
      context: ./apps/api-gateway
    container_name: api-gateway
    env_file:
      - ./apps/api-gateway/.env
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api-gateway/src:/app/src
    command: npm run dev
    stdin_open: true
    tty: true
    depends_on:
      - auth-service
      - catalog-service
      - order-service

  auth-service:
    build:
      context: .
      dockerfile: ./apps/auth-service/Dockerfile
    container_name: auth-service
    env_file:
      - ./apps/auth-service/.env
    expose:
      - "3001"
    volumes:
      - ./apps/auth-service/src:/app/src
      - ./apps/auth-service/prisma:/app/prisma
    command: sh -c "npx prisma migrate deploy --config apps/auth-service/prisma.config.ts --schema apps/auth-service/prisma/schema.prisma && npm --prefix apps/auth-service run dev"
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    env_file:
      - ./docker/postgres/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitsupply -d fitsupply"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sql:/docker-entrypoint-initdb.d/init-multiple-dbs.sql
    ports:
      - "5433:5432"

  catalog-service:
    build:
      context: .
      dockerfile: ./apps/catalog-service/Dockerfile
    container_name: catalog-service
    env_file:
      - ./apps/catalog-service/.env
    expose:
      - "3002"
    volumes:
      - ./apps/catalog-service/src:/app/src
    command: npm run dev
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy


  order-service:
    build:
      context: .
      dockerfile: ./apps/order-service/Dockerfile
    container_name: order-service
    env_file:
      - ./apps/order-service/.env
    expose:
      - "3003"
    volumes:
      - ./apps/order-service/src:/app/src
    command: npm run dev
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
