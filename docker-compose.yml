    command: sh -c "npx prisma migrate deploy --config apps/notification-service/prisma.config.ts --schema apps/notification-service/prisma/schema.prisma && npm --prefix apps/notification-service run dev"
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
      shared-watcher:
        condition: service_started

volumes:
  postgres_data:
